name: Didge Redash Workflows

permissions:
  id-token: write
  contents: read

on:
  pull_request:
    branches:
      - '**'
  push:
    branches:
      - uat
      - production

env:
  REPOSITORY: didge-redash # ecr repo

jobs:
  # the way it works,
  # 1. it will run automatically, but will fail
  # 2. WHEN WE RE-RUN it. then it will trigger actual next release job.
  build-trigger:
    name: 'Build: Prepare (Re-run the job to trigger it)'
    runs-on: ubuntu-latest
    outputs:
      CONTINUE_JOBS: ${{ steps.manual-trigger.outputs.CONTINUE_JOBS }}
    steps:
      - name: manual-trigger
        id: manual-trigger
        uses: IncludeHealth/manual-trigger@v1
        with:
          RUN_NAME: 'build'

  build:
    name: 'Build'
    runs-on: ubuntu-latest
    needs:
      - build-trigger
    if: ${{ needs.build-trigger.outputs.CONTINUE_JOBS == 'true' }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS - Assume Role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          audience: sts.amazonaws.com
          aws-region: ${{ vars.BUILD_AWS_REGION }}
          role-to-assume: ${{ vars.BUILD_AWS_ROLE }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registries: ${{ vars.BUILD_ECR_ACCOUNT_ID }}

      - name: Build, tag, and push docker image to Amazon ECR
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build -f ./Dockerfile -t $REGISTRY/$REPOSITORY:$GITHUB_SHA -t $REGISTRY/$REPOSITORY:latest .
          docker push $REGISTRY/$REPOSITORY:$GITHUB_SHA
          docker push $REGISTRY/$REPOSITORY:latest

  # ------------------------------------------------------------------------

  # the way it works,
  # 1. it will run automatically, but will fail
  # 2. WHEN WE RE-RUN it. then it will trigger actual next release job.
  redash-trigger-release-uat:
    name: 'UAT Redash: Prepare (Re-run the job to trigger it)'
    needs:
      - build
    runs-on: ubuntu-latest
    outputs:
      CONTINUE_JOBS: ${{ steps.manual-trigger.outputs.CONTINUE_JOBS }}
    steps:
      - name: manual-trigger
        id: manual-trigger
        uses: IncludeHealth/manual-trigger@v1
        with:
          RUN_NAME: 'redash-release-uat'

  redash-release-uat-eks:
    name: 'UAT Redash: Deploy to EKS'
    runs-on: ubuntu-latest
    container: alpine/terragrunt:tf1.8.4
    needs:
      - redash-trigger-release-uat
    if: ${{ needs.redash-trigger-release-uat.outputs.CONTINUE_JOBS == 'true' }}
    environment: uat
    env:
      TF_APP_DIR: 'infrastructure/didge/terragrunt/live/uat/infra-redash'
      TF_TOKEN_app_terraform_io: ${{ secrets.DEPLOY_TF_TOKEN_APP_TERRAFORM_IO }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout CI/CD Repo
        uses: actions/checkout@v4
        with:
          repository: project-manager-department/infrastructure
          token: ${{ secrets.DEPLOY_GH_PAT_REPO_CICD }}
          path: infrastructure
          ref: 'master'

      - name: 'Deploy EKS'
        uses: ./.github/actions/deploy-eks
        with:
          appname: redash

  # ------------------------------------------------------------------------

  # the way it works,
  # 1. it will run automatically, but will fail
  # 2. WHEN WE RE-RUN it. then it will trigger actual next release job.
  redash-trigger-release-production:
    name: 'Production Redash: Prepare (Re-run the job to trigger it)'
    needs:
      - build
    runs-on: ubuntu-latest
    outputs:
      CONTINUE_JOBS: ${{ steps.manual-trigger.outputs.CONTINUE_JOBS }}
    steps:
      - name: manual-trigger
        id: manual-trigger
        uses: IncludeHealth/manual-trigger@v1
        with:
          RUN_NAME: 'redash-release-production'

  redash-release-production-eks:
    name: 'Production Redash: Deploy to EKS'
    runs-on: ubuntu-latest
    container: alpine/terragrunt:tf1.8.4
    needs:
      - redash-trigger-release-production
    if: ${{ needs.redash-trigger-release-production.outputs.CONTINUE_JOBS == 'true' }}
    environment: production
    env:
      TF_APP_DIR: 'infrastructure/didge/terragrunt/live/production/infra-redash'
      TF_TOKEN_app_terraform_io: ${{ secrets.DEPLOY_TF_TOKEN_APP_TERRAFORM_IO }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout CI/CD Repo
        uses: actions/checkout@v4
        with:
          repository: project-manager-department/infrastructure
          token: ${{ secrets.DEPLOY_GH_PAT_REPO_CICD }}
          path: infrastructure
          ref: 'master'

      - name: 'Deploy EKS'
        uses: ./.github/actions/deploy-eks
        with:
          appname: redash
